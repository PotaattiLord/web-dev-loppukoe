<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Yhteydenotto</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Yhteydenotto lomake</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
        </header>
        <form action="https://httpbin.org/post" method="POST">
            <br>
            <label for="name">Nimi:</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Sähköposti:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="phonenumber">Puhelinnumero:</label>
            <input type="tel" id="phonenumber" name="phonenumber" placeholder="0401234567" pattern="\+?[0-9]{7,15}" >
            <br><br>

            <label for="vene">Vene, josta kiinnostunut:</label>
            <select id="vene" name="vene" required>
                <option value="" >Valitse Vene</option>
                <option value="moottorivene">Moottorivene</option>
                <option value="vene2">Vene2</option>
                <option value="vene3">Vene3</option>
            </select>
            <br><br>

            <label for="viesti">Viesti:</label>
            <textarea id="viesti" name="viesti" rows="5" cols="30">

            </textarea>
            <br><br>
            <button type="submit" id="submitBtn">Lähetä</button>


        </form>


        <footer>
            <p>&copy; 2026 Vilperin Veneet. All rights reserved.</p>
        </footer>
    </body>
</html>
